services:
  app:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - .env
    volumes:
      # STORAGE_DRIVER=local writes here. Bind-mounted to ./uploads so the files
      # survive container recreation and are visible on the host.
      - ./uploads:/usr/src/app/uploads
    depends_on:
      - postgres
      - redis
      - mailpit

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # Dev mail catcher: set MAIL_HOST=mailpit, MAIL_PORT=1025 in .env. Web UI and
  # HTTP API (the Postman collection reads confirmation emails from it) on
  # http://localhost:8026 — host port 8025 is often taken by other projects.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8026:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres_data:
  redis_data:
